# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: macos-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      # Set up .NET
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
              dotnet-version: '8.0.x'

      #Build the SQL Database Project
      - name: Build
        run: dotnet build DP-800dbProj/DP-800dbProj.sqlproj

      # Save the compiled .dacpac so the deploy job can use it
      - name: Upload dacpac
        uses: actions/upload-artifact@v4
        with:
          name: dacpac
          path: DP-800dbProj/bin/Debug/DP-800dbProj.dacpac

  # Deploys the .dacpac to Azure SQL (DP800Free) — only on pushes to main or manual runs, never on PRs
  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    # sql-action supports Linux and Windows runners, not macOS
    runs-on: ubuntu-latest

    steps:
      # Needed for the publish profile
      - uses: actions/checkout@v4

      - name: Download dacpac
        uses: actions/download-artifact@v4
        with:
          name: dacpac

      # sqlpackage is no longer preinstalled on ubuntu-latest; install it as a .NET global tool
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install sqlpackage
        run: |
          dotnet tool install --global microsoft.sqlpackage
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      # Lets sql-action add a temporary firewall rule for this runner's IP
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # Publish profile keeps DropObjectsNotInSource=False so School/SalesLT tables are not dropped
      - name: Deploy to Azure SQL
        uses: azure/sql-action@v2.4
        with:
          connection-string: ${{ secrets.SQL_CONNECTION_STRING }}
          path: DP-800dbProj.dacpac
          action: publish
          arguments: /Profile:DP-800dbProj/DP-800dbProj_PublishProfile.publish.xml
